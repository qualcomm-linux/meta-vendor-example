# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS      += "vendor-example"
BBFILE_PATTERN_vendor-example   = "^${LAYERDIR}/"
BBFILE_PRIORITY_vendor-example  = "10"

LAYERDEPENDS_vendor-example = "qcom"
LAYERSERIES_COMPAT_vendor-example = "whinlatter"
